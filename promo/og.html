<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snaps — social card</title>
<!-- 1200×630 Open Graph / Twitter card. Rendered to docs/assets/og.png by `npm run og`. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: white; -webkit-font-smoothing: antialiased;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    background:
      radial-gradient(520px 420px at 10% 0%, rgba(34, 211, 238, 0.30), transparent 70%),
      radial-gradient(620px 520px at 100% 100%, rgba(99, 102, 241, 0.45), transparent 70%),
      radial-gradient(420px 320px at 62% 0%, rgba(59, 130, 246, 0.22), transparent 70%),
      linear-gradient(145deg, #0b1026, #111a3d 55%, #1a1446);
  }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.07) 1.2px, transparent 1.4px); background-size: 28px 28px; }

  .left { position: absolute; left: 72px; top: 92px; width: 520px; }
  .icon { width: 124px; height: 124px; filter: drop-shadow(0 18px 36px rgba(56, 189, 248, 0.35)); }
  .word { font-size: 108px; font-weight: 800; letter-spacing: -3.5px; line-height: 1; margin-top: 18px; }
  .tag { font-size: 34px; font-weight: 600; line-height: 1.2; margin-top: 16px; color: rgba(255,255,255,0.78); }
  .tag b { background: linear-gradient(90deg, #67e8f9, #a5b4fc 60%, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
  .chips { display: flex; gap: 10px; margin-top: 28px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-size: 19px; font-weight: 700;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06)); border: 1px solid rgba(255,255,255,0.22); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; display: block; }

  /* Product visual: a mini desktop with the glass preview + toast. */
  .screen { position: absolute; left: 640px; top: 88px; width: 500px; height: 420px; border-radius: 26px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(3, 6, 25, 0.55), 0 0 0 1px rgba(255,255,255,0.14);
    background:
      radial-gradient(260px 220px at 10% 15%, #7dd3fc, transparent 70%),
      radial-gradient(320px 260px at 90% 10%, #a78bfa, transparent 70%),
      radial-gradient(320px 260px at 75% 100%, #6366f1, transparent 70%),
      linear-gradient(160deg, #60a5fa, #4f46e5); }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 22px; background: rgba(255,255,255,0.18); }
  .menubar::before { content: ""; position: absolute; right: 64px; top: 5px; width: 12px; height: 12px; border: 2px solid white; border-radius: 3px; opacity: 0.9; }
  .win { position: absolute; border-radius: 12px; background: rgba(255,255,255,0.92); box-shadow: 0 14px 30px rgba(15,23,60,0.3); }
  .win .bar { height: 22px; border-bottom: 1px solid #e6e8ef; display: flex; gap: 5px; align-items: center; padding: 0 10px; }
  .win .bar i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .line { height: 9px; border-radius: 5px; background: #e5e8f0; margin: 10px 14px 0; }

  .preview { position: absolute; left: 22px; bottom: 22px; width: 250px; padding: 6px; border-radius: 20px;
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.6);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 16px 34px rgba(15, 20, 70, 0.45);
    -webkit-backdrop-filter: blur(16px) saturate(170%); backdrop-filter: blur(16px) saturate(170%); }
  .shot { border-radius: 14px; background: white; padding: 12px 14px; color: #161b2b; }
  .shot .k { font: 600 11px -apple-system, system-ui; color: #7a8295; }
  .shot .v { font: 800 22px -apple-system, system-ui; letter-spacing: -0.5px; margin-top: 2px; }
  .shot .v span { font-size: 10px; color: #059669; background: #d1fae5; padding: 2px 6px; border-radius: 99px; vertical-align: 4px; margin-left: 4px; }
  .toast { position: absolute; left: 92px; bottom: 156px; padding: 8px 14px; border-radius: 999px; font-size: 16px; font-weight: 800; color: #0f172a;
    background: rgba(255,255,255,0.85); box-shadow: 0 10px 24px rgba(15,20,70,0.3); }
  .keys { position: absolute; right: 22px; top: 44px; display: flex; gap: 6px; padding: 8px; border-radius: 16px;
    background: rgba(15, 20, 45, 0.35); border: 1px solid rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .key { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; font-weight: 700; color: #141827;
    background: linear-gradient(180deg, #ffffff, #e5e9f4); box-shadow: 0 3px 0 #a7aec4; }
  .url { position: absolute; left: 640px; top: 534px; width: 500px; text-align: center; font-size: 19px; font-weight: 700; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="left">
    <img class="icon" src="../assets/icon.svg" alt="">
    <div class="word">Snaps</div>
    <div class="tag">Screenshots that land on <b>your clipboard.</b></div>
    <div class="chips"><div class="chip"><i></i>Free &amp; open source</div><div class="chip">macOS 26+</div></div>
  </div>

  <div class="screen">
    <div class="menubar"></div>
    <div class="win" style="left:40px;top:58px;width:300px;height:190px">
      <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="line" style="width:40%"></div><div class="line" style="width:70%"></div><div class="line" style="width:55%"></div>
      <svg width="272" height="80" viewBox="0 0 272 80" style="margin:12px 14px 0">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>
        <path d="M0 64 L34 52 L68 56 L102 40 L136 44 L170 28 L204 32 L238 16 L272 8 L272 80 L0 80Z" fill="url(#g)"/>
        <path d="M0 64 L34 52 L68 56 L102 40 L136 44 L170 28 L204 32 L238 16 L272 8" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="win" style="left:310px;top:120px;width:160px;height:150px">
      <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="line" style="width:60%"></div><div class="line" style="width:80%"></div><div class="line" style="width:45%"></div><div class="line" style="width:70%"></div>
    </div>

    <div class="keys"><div class="key">⌃</div><div class="key">⇧</div><div class="key">4</div></div>

    <div class="toast">✓ Copied</div>
    <div class="preview">
      <div class="shot">
        <div class="k">Weekly active users</div>
        <div class="v">48,210<span>▲ 18.4%</span></div>
        <svg width="222" height="58" viewBox="0 0 272 70" style="margin-top:6px;display:block">
          <path d="M0 58 L34 46 L68 50 L102 34 L136 38 L170 22 L204 26 L238 12 L272 4 L272 70 L0 70Z" fill="#6366f1" fill-opacity=".15"/>
          <path d="M0 58 L34 46 L68 50 L102 34 L136 38 L170 22 L204 26 L238 12 L272 4" fill="none" stroke="#6366f1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="url">nearbycoder.github.io/snaps</div>
</body>
</html>
