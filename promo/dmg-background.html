<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snaps — DMG background</title>
<!--
  Background for the installer window. Finder shows 640×400 pt of it (the window is
  taller to make room for the title bar); the extra 30 pt at the bottom is a safety
  margin in case the title bar is shorter. Rendered at 1x and 2x by `npm run dmg-background`.
  Icon centers must match Resources/dmg/settings.py: Snaps.app at (160, 186),
  Applications at (480, 186). Add ?preview-dark / ?preview-light to overlay mock icons.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 640px; height: 430px; overflow: hidden; }
  body {
    position: relative; color: white;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(300px 240px at 6% 0%, rgba(103, 232, 249, 0.7), transparent 70%),
      radial-gradient(360px 280px at 100% 6%, rgba(167, 139, 250, 0.65), transparent 70%),
      radial-gradient(420px 260px at 50% 120%, rgba(30, 27, 110, 0.8), transparent 70%),
      linear-gradient(165deg, #3b82f6, #4f5ee8 55%, #4338ca);
  }
  .dots { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.09) 1px, transparent 1.3px); background-size: 22px 22px;
    mask-image: linear-gradient(180deg, black, transparent 80%); }
  .sheen { position: absolute; inset: 0; background: radial-gradient(500px 150px at 50% -30px, rgba(255,255,255,0.3), transparent 70%); }

  h1 { position: absolute; top: 30px; width: 100%; text-align: center; font-size: 24px; font-weight: 800; letter-spacing: -0.4px;
    text-shadow: 0 2px 12px rgba(20, 20, 80, 0.3); }
  .sub { position: absolute; top: 64px; width: 100%; text-align: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); }

  /* Soft light pooled behind each icon. */
  .glow { position: absolute; width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.26), rgba(255,255,255,0.08) 60%, transparent); }
  .glow.app { left: calc(160px - 95px); top: calc(186px - 95px); }
  .glow.apps { left: calc(480px - 95px); top: calc(186px - 95px); }

  .arrow { position: absolute; left: 270px; top: 163px; width: 100px; height: 46px; }

  .hint { position: absolute; left: 50%; top: 318px; transform: translateX(-50%); white-space: nowrap;
    padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: rgba(15, 18, 60, 0.3); border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.9); }
  .hint b { font-weight: 800; color: white; }
  .foot { position: absolute; top: 364px; width: 100%; text-align: center; font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,0.55); letter-spacing: 0.2px; }

  /* Preview-only mock of what Finder draws on top. */
  .mock { display: none; position: absolute; width: 128px; height: 128px; }
  .mock-label { display: none; position: absolute; width: 160px; text-align: center; font: 500 13px -apple-system, system-ui; }
  .titlebar { display: none; position: absolute; left: 0; right: 0; top: 0; height: 30px; background: #2b2930; }
  body.preview .mock, body.preview .mock-label { display: block; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="sheen"></div>

  <h1>Install Snaps</h1>
  <div class="sub">Drag Snaps into your Applications folder</div>

  <div class="glow app"></div>
  <div class="glow apps"></div>

  <svg class="arrow" viewBox="0 0 100 46" fill="none">
    <defs>
      <linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="6" y1="23" x2="82" y2="23"><stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    </defs>
    <path d="M6 23 H80" stroke="url(#ag)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 13"/>
    <path d="M70 10 L86 23 L70 36" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="hint">✦ Then open Snaps and <b>drag it into the Screen Recording list</b></div>
  <div class="foot">Free &amp; open source · nearbycoder.github.io/snaps</div>

  <!-- Mock Finder icons/labels (only with ?preview-…) -->
  <img class="mock" src="../assets/icon.svg" style="left:96px;top:122px">
  <div class="mock" style="left:416px;top:130px;height:112px;border-radius:12px;background:linear-gradient(180deg,#7cc8ff,#2f8ef0)"></div>
  <div class="mock-label" id="l1" style="left:80px;top:258px">Snaps</div>
  <div class="mock-label" id="l2" style="left:400px;top:258px">Applications</div>
  <script>
    const q = location.search;
    if (q.includes("preview")) {
      document.body.classList.add("preview");
      const color = q.includes("light") ? "black" : "white";
      document.getElementById("l1").style.color = color;
      document.getElementById("l2").style.color = color;
    }
  </script>
</body>
</html>
